# CECT SuperAdmin DEMO — SNIPPET FOR THE EXISTING HTTPS admin vhost
#
# Insert these DIRECTIVES INSIDE THE EXISTING "server { listen 443 ssl; ... }"
# block for admin.13-49-203-235.sslip.io, rather than adding a second server
# block with the same listen/server_name. Requires a privileged administrator.
#
# Do NOT include this snippet in an HTTP (port 80) server.
# Keep ALL existing regular / and /assets/ locations unchanged.
#
# SSL client cert verification is optional at HOST level because ordinary
# Administrators must still access /connexion without a certificate.
# SuperAdmin routes below are fail-closed and require SUCCESS.
#
# CA/CRL are publicly shareable; never deploy the CA private key.
ssl_client_certificate /home/ubuntu/cect-demo-pki/ca.crt;
ssl_verify_client optional;
ssl_verify_depth 1;
ssl_crl /home/ubuntu/cect-demo-pki/clients.crl.pem;

# SuperAdmin HTML is never shown without a valid browser certificate.
location = /superadmin {
    if ($ssl_client_verify != SUCCESS) { return 403; }
    return 302 /superadmin/connexion;
}
location ^~ /superadmin/ {
    if ($ssl_client_verify != SUCCESS) { return 403; }
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
}

# The SuperAdmin React client uses SAME-ORIGIN /api/v1/* during the
# entire session, including on /admin/dashboard after sign-in.
# Non-SuperAdmin backoffice stays on its existing public API hostname.
location ^~ /api/ {
    if ($ssl_client_verify != SUCCESS) { return 403; }
    root /var/www/cect-api/public;
    try_files $uri /index.php?$query_string;
}

# Sanctum CSRF endpoint must share the mTLS-verified origin.
location ^~ /sanctum/ {
    if ($ssl_client_verify != SUCCESS) { return 403; }
    root /var/www/cect-api/public;
    try_files $uri /index.php?$query_string;
}

# PHP front controller, invoked only by Nginx internal redirects above.
# NEVER accept a public HTTP header as CECT_MTLS_VERIFY/CERT.
location = /index.php {
    internal;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/cect-api/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_param CECT_MTLS_VERIFY $ssl_client_verify;
    fastcgi_param CECT_MTLS_CERT $ssl_client_escaped_cert;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
}

# DO NOT define a second 'location ~ \.php$' if one is already present:
# ensure all direct .php requests on this admin vhost return 404/deny.
# Add 'location ~ \.php$ { return 404; }' when absent.
#
# BEFORE ACTIVATION
# 1. Backup the existing admin 443 vhost.
# 2. Add the snippet, make sure no location names collide.
# 3. Ensure demo CA and current CRL are readable by nginx.
# 4. Ensure PHP-FPM can traverse/read the app path.
# 5. nginx -t (must pass) then reload nginx.
# 6. curl without cert to /superadmin/connexion -> 403
# 7. browser with matching p12 -> 200 login HTML, then status API 200 after feature gate.
# 8. ordinary /connexion -> 200 with no client certificate.
# 9. invalid or revoked cert -> reject; directly hitting public API -> 403/503.
