[www]
listen = 127.0.0.1:9000
; Render injects configuration as environment variables: keep them visible to PHP.
clear_env = no
; Workers run as www-data but inherit HOME=/root: libpq would fail reading /root/.postgresql.
env[HOME] = /var/www
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
